name: Test Relay database security

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/database-tests.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/database-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
