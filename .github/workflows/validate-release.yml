name: Validate TrainWell release
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=1
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npx playwright test --config tests/layout.playwright.config.ts
      - run: npx playwright test --config tests/auth-ui.playwright.config.ts
      - run: npx playwright test --config tests/legal-ui.playwright.config.ts
      - run: npm run build
        env:
          DEPLOY_TARGET: cloudflare
      - run: node scripts/check-static-export.mjs
      - run: npm run build
        env:
          DEPLOY_TARGET: github-pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-results
          path: test-results/
