project_id = "relay-coach-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "https://junweijayli-cell.github.io/personal-trainer/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
password_min_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 900

[auth.email.template.confirmation]
subject = "Relay verification code / Relay 验证码"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Relay password / 重置 Relay 密码"
content_path = "./supabase/templates/recovery.html"

[functions.stripe-webhook]
verify_jwt = false

[functions.get-billing-catalog]
verify_jwt = false
