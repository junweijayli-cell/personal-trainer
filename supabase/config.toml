project_id = "relay-coach-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://junweijayli-cell.github.io/personal-trainer/"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**", "https://junweijayli-cell.github.io/personal-trainer/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 900

[auth.email.template.confirmation]
subject = "TrainWell verification code / TrainWell 验证码"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your TrainWell password / 重置 TrainWell 密码"
content_path = "./supabase/templates/recovery.html"

[functions.stripe-webhook]
verify_jwt = false

[functions.get-billing-catalog]
verify_jwt = false
